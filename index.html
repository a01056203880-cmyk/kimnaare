<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>벽돌깨기</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #87ceeb; /* 하늘색 바탕 */
      font-family: "Malgun Gothic", sans-serif;
    }
    h1 { color: #ffffff; text-shadow: 2px 2px 0 #3a7ca5; margin: 10px; }
    #game {
      background: #5a3b24; /* 게임 화면은 책장(나무색) */
      border: 4px solid #ffffff;
      border-radius: 8px;
    }
    #startBtn {
      margin-top: 16px;
      padding: 12px 32px;
      font-size: 20px;
      font-weight: bold;
      color: #3a7ca5;
      background: #ffffff;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }
    #startBtn:hover { background: #f0eee9; }
    p { color: #2f5f7f; }
  </style>
</head>
<body>
  <h1>📚 벽돌깨기</h1>
  <canvas id="game" width="480" height="580"></canvas>
  <button id="startBtn">게임 시작</button>
  <p>← → 방향키로 패들을 움직여요 · 🟫 갈색 책: 패들 길어짐 · 🟨 노란 책: 공 추가</p>

  <script>
    // ===== 1. 기본 준비 =====
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d"); // 그림 그리는 붓
    const startBtn = document.getElementById("startBtn");

    // ===== 2. 벽돌 설정 (5줄 x 8칸) =====
    const ROWS = 5;
    const COLS = 8;
    const BRICK_W = 38; // 책 너비
    const BRICK_H = 48; // 책 높이
    const GAP = 10;     // 책 사이 간격
    const SHELF_H = 10; // 선반 두께
    const ROW_GAP = BRICK_H + SHELF_H + 2; // 한 칸(책 + 선반) 높이
    const TOP = 40;
    const LEFT = (canvas.width - (COLS * BRICK_W + (COLS - 1) * GAP)) / 2;

    // 2026년 팬톤 올해의 색 "클라우드 댄서(Cloud Dancer)"
    // 줄마다 다르게 보이도록 같은 색을 조금씩 진하게 바꿨어요
    const ROW_COLORS = ["#F0EEE9", "#E5E1D8", "#D9D3C7", "#CCC4B5", "#BFB5A3"];

    // 레벨마다 바뀌는 공 색깔 (빨주노초파남보)
    const BALL_COLORS = ["#ff3b30", "#ff9500", "#ffdd00", "#34c759", "#1e90ff", "#3a3fbf", "#9b59d0"];

    // ===== 3. 아이템 설정 =====
    const ITEM_CHANCE = 0.2;   // 아이템이 나올 확률 20%
    const ITEM_W = 16;
    const ITEM_H = 24;
    const ITEM_SPEED = 2.5;    // 아이템이 떨어지는 속도
    const PADDLE_W = 80;       // 패들 기본 길이
    const PADDLE_MAX_W = 160;  // 패들 최대 길이

    // ===== 4. 패들, 공, 게임 상태 =====
    const paddle = { w: PADDLE_W, h: 12, x: 0, y: canvas.height - 30, speed: 7 };
    let balls = [];  // 공이 여러 개일 수 있어서 목록으로 관리
    let items = [];  // 떨어지고 있는 아이템들
    let bricks = [];
    let playing = false;
    let score = 0;   // 점수 (벽돌 1개 = 10점)
    let lives = 3;   // 남은 기회
    let level = 1;   // 지금 레벨
    let cleared = false; // 방금 클리어했는지 (버튼이 "다음 레벨"이 됨)
    let leftKey = false;
    let rightKey = false;

    // 레벨이 1 오를 때마다 10%씩 빨라지는 배율 (너무 빨라지지 않게 최대 2배)
    function speedRate() {
      return Math.min(Math.pow(1.1, level - 1), 2);
    }

    // 지금 레벨의 공 색깔 (8레벨부터는 다시 빨강부터)
    function ballColor() {
      return BALL_COLORS[(level - 1) % BALL_COLORS.length];
    }

    // ===== 5. 처음 상태로 되돌리기 =====
    function makeBricks() {
      bricks = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          bricks.push({
            x: LEFT + c * (BRICK_W + GAP),
            y: TOP + r * ROW_GAP,
            color: ROW_COLORS[r],
            alive: true
          });
        }
      }
    }

    // 새 공 하나 만들기
    function makeBall(x, y, dirX) {
      return {
        r: 8,
        x: x,
        y: y,
        dx: 3.3 * dirX * speedRate(),
        dy: -4.4 * speedRate() // 위로 출발
      };
    }

    // 패들과 공을 처음 자리로 (새 레벨 시작, 기회를 잃었을 때 사용)
    function resetBall() {
      paddle.w = PADDLE_W;
      paddle.x = (canvas.width - paddle.w) / 2;
      const dirX = Math.random() < 0.5 ? -1 : 1; // 왼쪽/오른쪽 랜덤
      balls = [makeBall(canvas.width / 2, paddle.y - 10, dirX)];
      items = [];
    }

    // ===== 6. 그리기 =====
    // 책장 배경 그리기
    function drawBookshelf() {
      // 뒷판
      ctx.fillStyle = "#5a3b24";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // 뒷판 나무 무늬 (세로 줄)
      ctx.strokeStyle = "#4b311d";
      ctx.lineWidth = 2;
      for (let x = 60; x < canvas.width; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      // 양쪽 기둥
      ctx.fillStyle = "#7a5232";
      ctx.fillRect(0, 0, 14, canvas.height);
      ctx.fillRect(canvas.width - 14, 0, 14, canvas.height);
      // 책 아래 선반들
      for (let r = 0; r < ROWS; r++) {
        const y = TOP + r * ROW_GAP + BRICK_H;
        ctx.fillStyle = "#8b5e3c";
        ctx.fillRect(0, y, canvas.width, SHELF_H);
        ctx.fillStyle = "#a87447"; // 선반 윗면 (밝게)
        ctx.fillRect(0, y, canvas.width, 3);
      }
    }

    // 책 모양 벽돌 그리기 (책등이 보이게 꽂힌 책)
    function drawBricks() {
      for (const b of bricks) {
        if (!b.alive) continue;
        // 책 몸통
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, BRICK_W, BRICK_H);
        // 책등 위아래 띠
        ctx.fillStyle = "#9c8f7a";
        ctx.fillRect(b.x, b.y + 5, BRICK_W, 4);
        ctx.fillRect(b.x, b.y + BRICK_H - 9, BRICK_W, 4);
        // 가운데 세로 제목 줄
        ctx.fillStyle = "#6f6455";
        ctx.fillRect(b.x + BRICK_W / 2 - 3, b.y + 14, 2, BRICK_H - 28);
        ctx.fillRect(b.x + BRICK_W / 2 + 2, b.y + 17, 2, BRICK_H - 34);
        // 테두리
        ctx.strokeStyle = "#3d2a1a";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(b.x, b.y, BRICK_W, BRICK_H);
      }
    }

    // 떨어지는 아이템 그리기 (작은 책 모양)
    function drawItems() {
      for (const it of items) {
        ctx.fillStyle = it.type === "long" ? "#c68642" : "#ffd23f"; // 갈색 / 노란색
        ctx.fillRect(it.x, it.y, ITEM_W, ITEM_H);
        ctx.fillStyle = "rgba(0, 0, 0, 0.3)"; // 책등 띠
        ctx.fillRect(it.x, it.y + 4, ITEM_W, 3);
        ctx.fillRect(it.x, it.y + ITEM_H - 7, ITEM_W, 3);
        ctx.strokeStyle = "#ffffff"; // 책장 위에서 잘 보이게 흰 테두리
        ctx.lineWidth = 2;
        ctx.strokeRect(it.x, it.y, ITEM_W, ITEM_H);
      }
    }

    function drawPaddle() {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
      ctx.strokeStyle = "#3a7ca5";
      ctx.lineWidth = 1;
      ctx.strokeRect(paddle.x, paddle.y, paddle.w, paddle.h);
    }

    function drawBalls() {
      for (const ball of balls) {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fillStyle = ballColor();
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    function drawBigText(text, color, subText, subText2) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = color;
      ctx.font = "bold 56px 'Malgun Gothic', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, canvas.width / 2, canvas.height / 2 - 15);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 22px 'Malgun Gothic', sans-serif";
      if (subText) ctx.fillText(subText, canvas.width / 2, canvas.height / 2 + 40);
      if (subText2) ctx.fillText(subText2, canvas.width / 2, canvas.height / 2 + 72);
    }

    // 위쪽에 점수, 레벨, 남은 기회 보여주기
    function drawInfo() {
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 16px 'Malgun Gothic', sans-serif";
      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      ctx.fillText("점수: " + score, 20, 18);
      ctx.textAlign = "center";
      ctx.fillText("레벨 " + level, canvas.width / 2, 18);
      ctx.textAlign = "right";
      ctx.fillText("기회: " + "❤️".repeat(lives), canvas.width - 20, 18);
    }

    function drawAll() {
      drawBookshelf();
      drawInfo();
      drawBricks();
      drawItems();
      drawPaddle();
      drawBalls();
    }

    // ===== 7. 움직이기 =====
    // 공 하나 움직이기
    function moveBall(ball) {
      ball.x += ball.dx;
      ball.y += ball.dy;

      // 왼쪽/오른쪽 벽에 부딪히면 튕기기
      if (ball.x - ball.r < 0) ball.dx = Math.abs(ball.dx);
      if (ball.x + ball.r > canvas.width) ball.dx = -Math.abs(ball.dx);
      // 위쪽 벽에 부딪히면 튕기기
      if (ball.y - ball.r < 0) ball.dy = Math.abs(ball.dy);

      // 패들에 부딪히면 튕기기 (맞은 위치에 따라 방향이 달라짐)
      if (ball.dy > 0 &&
          ball.y + ball.r >= paddle.y &&
          ball.y - ball.r <= paddle.y + paddle.h &&
          ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
        const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1 ~ 1
        ball.dx = hit * 5.5 * speedRate();
        // 공이 똑바로 위아래로만 움직이지 않게 살짝 기울이기
        if (Math.abs(ball.dx) < 1) ball.dx = ball.dx < 0 ? -1 : 1;
        ball.dy = -Math.abs(ball.dy);
      }

      // 벽돌에 부딪히면 벽돌 깨기
      for (const b of bricks) {
        if (!b.alive) continue;
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + BRICK_W &&
            ball.y + ball.r > b.y && ball.y - ball.r < b.y + BRICK_H) {
          b.alive = false;
          ball.dy *= -1;
          score += 10;
          // 20% 확률로 아이템 떨어뜨리기 (갈색/노란색 반반)
          if (Math.random() < ITEM_CHANCE) {
            items.push({
              x: b.x + BRICK_W / 2 - ITEM_W / 2,
              y: b.y + BRICK_H / 2,
              type: Math.random() < 0.5 ? "long" : "ball"
            });
          }
          break;
        }
      }
    }

    // 아이템 움직이기, 패들로 받으면 효과 주기
    function moveItems() {
      for (const it of items) {
        it.y += ITEM_SPEED;
        const caught = it.y + ITEM_H >= paddle.y && it.y <= paddle.y + paddle.h &&
                       it.x + ITEM_W >= paddle.x && it.x <= paddle.x + paddle.w;
        if (caught) {
          it.used = true;
          if (it.type === "long") {
            // 갈색 책: 패들 길어지기 (가운데를 기준으로)
            const center = paddle.x + paddle.w / 2;
            paddle.w = Math.min(paddle.w + 40, PADDLE_MAX_W);
            paddle.x = center - paddle.w / 2;
          } else {
            // 노란색 책: 패들 위에서 공 하나 추가
            const dirX = Math.random() < 0.5 ? -1 : 1;
            balls.push(makeBall(paddle.x + paddle.w / 2, paddle.y - 10, dirX));
          }
        }
      }
      // 받았거나 바닥으로 떨어진 아이템은 없애기
      items = items.filter(it => !it.used && it.y < canvas.height);
    }

    function update() {
      // 패들 움직이기
      if (leftKey) paddle.x -= paddle.speed;
      if (rightKey) paddle.x += paddle.speed;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, paddle.x));

      for (const ball of balls) moveBall(ball);
      moveItems();

      // 바닥으로 떨어진 공은 없애기
      balls = balls.filter(ball => ball.y - ball.r <= canvas.height);

      // 벽돌을 다 깨면 클리어
      if (bricks.every(b => !b.alive)) {
        drawAll();
        endGame(true);
        return;
      }

      // 공이 하나도 안 남으면 기회 1개 줄이기, 기회가 없으면 게임오버
      if (balls.length === 0) {
        lives--;
        if (lives <= 0) {
          drawAll();
          endGame(false);
          return;
        }
        // 기회가 남았으면 1초 쉬었다가 다시 출발
        resetBall();
        drawAll();
        drawBigText("기회 " + lives + "번 남음", "#ffffff");
        setTimeout(update, 1000);
        return;
      }

      drawAll();
      requestAnimationFrame(update); // 다음 장면 계속 그리기
    }

    // ===== 8. 시작과 끝 =====
    function startGame() {
      if (cleared) {
        level++;      // 클리어했으면 다음 레벨로 (기회는 그대로)
      } else {
        level = 1;    // 처음이거나 게임오버였으면 레벨 1부터
        lives = 3;
      }
      cleared = false;
      score = 0;
      makeBricks();
      resetBall();
      playing = true;
      startBtn.style.display = "none";
      update();
    }

    function endGame(isClear) {
      playing = false;
      cleared = isClear;
      if (isClear) {
        drawBigText("클리어!", "#ffe14d", "최종 점수: " + score + "점", "다음은 레벨 " + (level + 1) + "!");
        startBtn.textContent = "다음 레벨";
      } else {
        drawBigText("게임오버", "#ff4d4d", "최종 점수: " + score + "점", "도착한 레벨: " + level);
        startBtn.textContent = "다시 시작";
      }
      score = 0; // 점수 초기화
      startBtn.style.display = "inline-block";
    }

    startBtn.addEventListener("click", startGame);

    // ===== 9. 방향키 =====
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") leftKey = true;
      if (e.key === "ArrowRight") rightKey = true;
      if (playing && (e.key === "ArrowLeft" || e.key === "ArrowRight")) e.preventDefault();
    });
    document.addEventListener("keyup", e => {
      if (e.key === "ArrowLeft") leftKey = false;
      if (e.key === "ArrowRight") rightKey = false;
    });

    // 처음 화면: 책장과 책만 보여주기
    makeBricks();
    resetBall();
    drawAll();
  </script>
</body>
</html>
